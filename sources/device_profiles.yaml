# ==============================================================================
# Sentinel - Community Device Profiles & Companion App Compatibility Catalog
# Zero-telemetry, open-source crowdsourced IoT compatibility database.
#
# Schema:
#   id: unique identifier
#   name: human-readable device name
#   category: device category (e.g., robot_vacuum, 3d_printer, smart_kitchen, automotive, smart_home, smart_tv)
#   vendor: hardware manufacturer
#   models: list of representative models
#   control_plane:
#     description: what these APIs do (login, start/stop, status sync)
#     allowed_domains: list of domains that MUST NOT be blocked for the companion app to work
#   data_plane:
#     description: what telemetry/exfiltration Sentinel neutralizes
#     blocked_domains: list of telemetry, video upload, LiDAR floorplan, or ad-tracking domains
#   notes: implementation quirks, split-tunneling or network isolation advice
# ==============================================================================

version: "1.0.0"

devices:
  # ---------------------------------------------------------------------------
  # 1. Robot Vacuums & Mops
  # ---------------------------------------------------------------------------
  - id: ecovacs_deebot
    name: "Ecovacs Deebot Vacuums"
    category: robot_vacuum
    vendor: "Ecovacs"
    models: ["Deebot X1 Omni", "Deebot T20", "Deebot T30 Pro", "Deebot N8 Pro"]
    control_plane:
      description: "App login, real-time map fetching, remote cleaning commands (Ecovacs Home app)"
      allowed_domains:
        - "api-app.ww.ecouser.net"
        - "api-app.dc-eu.ww.ecouser.net"
        - "iot-api-nlp.dc-eu.ww.ecouser.net"
        - "codepush-base.dc-na.ww.ecouser.net"
        - "gl-es-api.ecovacs.com"
    data_plane:
      description: "LiDAR floorplan upload to Chinese cloud, video streams, and behavioral analytics"
      blocked_domains:
        - "open.ecovacs.com"
        - "sa-eu-datasink.ecovacs.com"
        - "bigdata-europe.ecovacs.com"
        - "gl-iot-media.ecouser.net"
    notes: "Never block api-app.* subdomains as they break login and remote start from 4G/5G."

  - id: roborock_vacuum
    name: "Roborock S-Series & Q-Series"
    category: robot_vacuum
    vendor: "Roborock"
    models: ["S8 Pro Ultra", "S7 MaxV", "Q Revo", "Q7 Max"]
    control_plane:
      description: "MQTT command broker, authentication, and status sync (Roborock app)"
      allowed_domains:
        - "api-eu.roborock.com"
        - "api.roborock.com"
        - "mqtt-eu.roborock.com"
        - "rrc-eu.roborock.com"
    data_plane:
      description: "Continuous telemetry, crash reporting, and user behavior analytics"
      blocked_domains:
        - "tracking.roborock.com"
        - "api-telemetry.roborock.com"
        - "log.roborock.com"

  - id: dreame_vacuum
    name: "Dreame Bot Vacuums"
    category: robot_vacuum
    vendor: "Dreame Technology"
    models: ["Dreame L10s Ultra", "Dreame L20 Ultra", "Dreame X40 Ultra"]
    control_plane:
      description: "Dreamehome cloud authentication, pairing, and schedule synchronization"
      allowed_domains:
        - "api.dreame.tech"
        - "iot.dreame.tech"
        - "dreamehome-api.dreame.tech"
    data_plane:
      description: "Big data logs and camera streaming analytics"
      blocked_domains:
        - "log.dreame.tech"
        - "data.dreame.tech"

  - id: irobot_roomba
    name: "iRobot Roomba & Braava"
    category: robot_vacuum
    vendor: "iRobot"
    models: ["Roomba j7+", "Roomba j9+", "Roomba Combo i8"]
    control_plane:
      description: "iRobot OS cloud synchronization and cleaning dispatch"
      allowed_domains:
        - "api.irobot.com"
        - "disc-prod.k8s.irobot.com"
    data_plane:
      description: "Obstacle image analysis exfiltration and targeted telemetry"
      blocked_domains:
        - "telemetry.irobot.com"
        - "analytics.irobot.com"

