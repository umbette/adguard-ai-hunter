  - id: wireless_projection
    name: "Wireless Android Auto & Apple CarPlay"
    category: automotive_projection
    vendor: "Google / Apple / Car OEMs"
    models: ["All wireless Android Auto & Apple CarPlay head units"]
    control_plane:
      description: "Wi-Fi Direct P2P video/touch streaming between phone and head unit"
      allowed_domains: []
    data_plane:
      description: "N/A (Local Wi-Fi Direct socket)"
      blocked_domains: []
    notes: "Requires WireGuard Split Tunneling on smartphone. Exclude 'Android Auto' (com.google.android.projection.gearhead) from VPN to prevent Communication Error 21 on Wi-Fi Direct (192.168.43.1 / 192.168.49.1)."

