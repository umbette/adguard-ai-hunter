adguard:
  scheme: "http"
  host: "127.0.0.1"
  port: 8080
  username: ""
  password: ""
  poll_interval_sec: 15
  batch_limit: 200

home_assistant:
  base_url: "http://127.0.0.1:8123"
  ws_url: "ws://127.0.0.1:8123/api/websocket"
  token: ""
  notify_service: "notify" # e.g. mobile_app_your_phone

gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  timeout_sec: 10.0

heuristics:
  entropy_threshold: 3.85
  rate_burst_threshold: 30
  rate_window_sec: 60
  cleanup_interval_sec: 600

storage:
  db_path: "/app/data/hunter_decisions.db"

dashboard:
  host: "0.0.0.0"
  port: 8087
  enabled: true
  api_key: "" # Optional local API key / Bearer token for standalone exposure

admission:
  enabled: false
  quarantine_unapproved: false
  notify_on_new_device: true

audit:
  enabled: true
  retrospective_hours: 48
