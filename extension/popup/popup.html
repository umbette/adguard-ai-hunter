<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Shield</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .status-box {
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .status-safe {
      background: #064e3b;
      border: 1px solid #059669;
      color: #a7f3d0;
    }
    .status-warning {
      background: #7c2d12;
      border: 1px solid #ea580c;
      color: #fed7aa;
    }
    .status-title {
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .status-desc {
      font-size: 12px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      margin-top: 8px;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <h2>Sentinel Shield</h2>
  </div>

  <div id="statusContainer" class="status-box status-safe">
    <div class="status-title" id="statusTitle">Nessun Avviso</div>
    <div class="status-desc" id="statusDesc">Nessuna anomalia riscontrata per i brand monitorati. Verifica euristica locale attiva.</div>
    <button class="btn btn-secondary" id="btnException" style="display: none;">Segnala come sito fidato</button>
    <button class="btn btn-secondary" id="btnBypassDnr" style="display: none;">Sblocca dominio (Bypass sessione)</button>
  </div>

  <div class="footer">
    Verifica locale degli URL visitati • Zero telemetria cloud
  </div>

  <script src="popup.js"></script>
</body>
</html>
