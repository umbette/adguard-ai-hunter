<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="layer-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#bg2)" stroke="#374151" stroke-width="1.5" />

  <!-- Header -->
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f9fafb" text-anchor="middle">
    AdGuard AI Hunter: Zero-Trust Multi-Layer Threat Defense
  </text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
    From real-time Shannon Entropy DGA detection to proactive zero-day ingestion with 30-day sliding TTL
  </text>

  <!-- 3 Pillars -->
  <!-- Pillar 1: Shannon Entropy -->
  <g transform="translate(40, 100)">
    <rect width="270" height="320" rx="12" fill="url(#layer-box)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="40" cy="40" r="18" fill="#3b82f6" fill-opacity="0.2" />
    <text x="40" y="46" font-family="sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">1</text>
    <text x="70" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#f3f4f6">Real-Time DGA</text>
    <text x="70" y="54" font-family="sans-serif" font-size="11" fill="#9ca3af">Shannon Entropy Engine</text>

    <rect x="20" y="80" width="230" height="75" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="30" y="102" font-family="monospace" font-size="11" fill="#f87171">xk92lms08a.biz</text>
    <text x="30" y="122" font-family="monospace" font-size="11" fill="#60a5fa">Entropy H = 4.15 &gt; 3.85</text>
    <text x="30" y="142" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">🚨 DGA C2 Beacon Flagged</text>

    <g transform="translate(20, 175)" font-family="sans-serif" font-size="12" fill="#d1d5db">
      <text y="0">• Intercepts queries in real time</text>
      <text y="22">• Independent subdomain audit</text>
      <text y="44">• Zero wait for upstream lists</text>
      <text y="66">• Stops command &amp; control</text>
      <text y="88">• &lt; 2ms latency overhead</text>
    </g>
  </g>

  <!-- Pillar 2: Proactive Threat Miner -->
  <g transform="translate(345, 100)">
    <rect width="270" height="320" rx="12" fill="url(#layer-box)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="40" cy="40" r="18" fill="#10b981" fill-opacity="0.2" />
    <text x="40" y="46" font-family="sans-serif" font-size="16" fill="#34d399" text-anchor="middle">2</text>
    <text x="70" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#f3f4f6">Zero-Day Mining</text>
    <text x="70" y="54" font-family="sans-serif" font-size="11" fill="#9ca3af">30-Day Sliding TTL</text>

    <rect x="20" y="80" width="230" height="75" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="30" y="102" font-family="sans-serif" font-size="11" fill="#9ca3af">Feeds: OpenPhish + URLhaus</text>
    <text x="30" y="122" font-family="monospace" font-size="11" fill="#34d399">SQLite DB: threat_miner.db</text>
    <text x="30" y="142" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">⏱️ Auto-purges dead IoCs</text>

    <g transform="translate(20, 175)" font-family="sans-serif" font-size="12" fill="#d1d5db">
      <text y="0">• Ingests hourly threat streams</text>
      <text y="22">• Expired domains pruned auto</text>
      <text y="44">• No 2-million-line list bloat</text>
      <text y="66">• Fresh &amp; fast memory footprint</text>
      <text y="88">• Free filter subscription output</text>
    </g>
  </g>

  <!-- Pillar 3: Zero-Trust Anti-Breakage -->
  <g transform="translate(650, 100)">
    <rect width="270" height="320" rx="12" fill="url(#layer-box)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="40" cy="40" r="18" fill="#f59e0b" fill-opacity="0.2" />
    <text x="40" y="46" font-family="sans-serif" font-size="16" fill="#fbbf24" text-anchor="middle">3</text>
    <text x="70" y="38" font-family="sans-serif" font-size="15" font-weight="700" fill="#f3f4f6">Anti-Breakage</text>
    <text x="70" y="54" font-family="sans-serif" font-size="11" fill="#9ca3af">Public Suffix &amp; Canaries</text>

    <rect x="20" y="80" width="230" height="75" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="30" y="102" font-family="sans-serif" font-size="11" fill="#34d399">🛡️ PSL: CDN Safe Guard</text>
    <text x="30" y="122" font-family="sans-serif" font-size="11" fill="#60a5fa">🌐 IDN Punycode Normalized</text>
    <text x="30" y="142" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">🔄 Canary Health Rollback</text>

    <g transform="translate(20, 175)" font-family="sans-serif" font-size="12" fill="#d1d5db">
      <text y="0">• Never sinkholes shared CDNs</text>
      <text y="22">• GitHub / Discord / Cloudflare safe</text>
      <text y="44">• Probes canaries post-compile</text>
      <text y="66">• Instant rollback if DNS fails</text>
      <text y="88">• 1-Tap Home Assistant pushes</text>
    </g>
  </g>
</svg>
