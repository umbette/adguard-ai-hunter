name: Build & Validate Threat Filter

on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/**'
      - 'scripts/build_filter.py'
      - 'tests/test_build_filter.py'
      - '.github/workflows/build-filter.yml'
  pull_request:
    paths:
      - 'sources/**'
      - 'scripts/build_filter.py'
      - 'tests/test_build_filter.py'

jobs:
  build_filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Run Filter Compiler and Guardrail Tests
        run: |
          python tests/test_build_filter.py
