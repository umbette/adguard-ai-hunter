name: Build & Validate Threat Filter

on:
  push:
    paths:
      - 'sources/**'
      - 'scripts/build_filter.py'
      - 'tests/test_build_filter.py'
  pull_request:
    paths:
      - 'sources/**'
      - 'scripts/build_filter.py'
      - 'tests/test_build_filter.py'

jobs:
  build_filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: |
          pip install pytest

      - name: Run Filter Compiler and Guardrail Tests
        run: |
          PYTHONPATH=. pytest tests/test_build_filter.py -v
