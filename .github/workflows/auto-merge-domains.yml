name: Auto-Validate Community Threat PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sources/domains.txt'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate_and_merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for unauthorized file changes
        id: check_files
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Enforce strictly: ONLY sources/domains.txt may be modified
          for file in $CHANGED_FILES; do
            if [ "$file" != "sources/domains.txt" ]; then
              echo "SECURITY ALERT: PR modifies unauthorized file: $file"
              exit 1
            fi
          done
          echo "safe=true" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Zero-Trust Compiler & Tests
        run: |
          PYTHONPATH=. pytest tests/test_build_filter.py -v

      - name: Validate Safe Community PR
        if: steps.check_files.outputs.safe == 'true'
        run: |
          echo "✅ Automated Zero-Trust Audit Passed: All domains RFC 1123 and Public Suffix List compliant. Ready for maintainer review."
