name: Auto-Validate & Merge Community Threat PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'sources/domains.txt'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate_and_merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for unauthorized file changes
        id: check_files
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Enforce strictly: ONLY sources/domains.txt may be modified
          for file in $CHANGED_FILES; do
            if [ "$file" != "sources/domains.txt" ]; then
              echo "SECURITY ALERT: PR modifies unauthorized file: $file"
              exit 1
            fi
          done
          echo "safe=true" >> $GITHUB_OUTPUT

      - name: Run Zero-Trust Compiler & Tests
        run: |
          python tests/test_build_filter.py

      - name: Auto-Merge Safe Community PR
        if: steps.check_files.outputs.safe == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "✅ Automated Zero-Trust Audit Passed: All domains RFC 1123 compliant, no forbidden modifiers, critical domains preserved."
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
