name: Request Alpha Access (RePlug / Nozzle Guardian)
description: Register interest in upcoming mobile upcycling builds and Nozzle Guardian printer testing
title: "[Alpha Access] "
labels: ["alpha-access"]
body:
  - type: markdown
    attributes:
      value: "Join the RePlug™ early-access testing track! Your GitHub handle will be notified when mobile builds or Nozzle Guardian test releases ship."
  - type: input
    id: track
    attributes:
      label: Requested Module Track
      placeholder: "e.g. Nozzle Guardian (Inkjet), 3D Printer Guard, or Full Android Companion"
    validations:
      required: true
  - type: input
    id: printer_hardware
    attributes:
      label: Target Printer or Appliance Model (if applicable)
      placeholder: "e.g. Epson EcoTank ET-2850, Canon MegaTank, Bambu Lab A1"
  - type: input
    id: dormant_device
    attributes:
      label: Dormant Smartphone / Tablet Model
      placeholder: "e.g. Samsung Galaxy S9, Xiaomi Redmi Note 8, iPad Mini 4"
  - type: input
    id: home_assistant
    attributes:
      label: Are you using Home Assistant or AdGuard Home?
      placeholder: "Yes / No"
