name: "Sentinel Core"
slug: "sentinel_core"
version: "0.4.1"
description: "Autonomous Local Cyber Defense Console — 15 IoT & Privacy Shields, CDN-Safe Malicious IP Correlation, Anti-Dynamic Pricing, Crypto Vault, and Zero-Trust Device Admission Control for AdGuard Home & Home Assistant."
url: "https://github.com/umbette/sentinel"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
host_network: true
homeassistant_api: true
init: false
ingress: true
ingress_port: 8087
panel_icon: "mdi:shield-check"
panel_title: "Sentinel"
options:
  adguard_url: "http://core-adguard:80"
  adguard_username: "admin"
  adguard_password: ""
  gemini_api_key: ""
  entropy_threshold: 3.85
  rate_burst_threshold: 30
  rate_window_sec: 60
  notify_service: "notify.notify"
  admission_enabled: false
  quarantine_unapproved: false
  notify_on_new_device: true
schema:
  adguard_url: str
  adguard_username: str
  adguard_password: password
  gemini_api_key: password?
  entropy_threshold: float
  rate_burst_threshold: int
  rate_window_sec: int
  notify_service: str
  admission_enabled: bool?
  quarantine_unapproved: bool?
  notify_on_new_device: bool?
